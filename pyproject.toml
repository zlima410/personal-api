[project]
name = "personal-api"
version = "0.1.0"
description = "Personal API"
readme = "README.md"
authors = [
    { name = "zlima410", email = "endercraft68@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
# This is a deployed application, not a distributable library: uv installs the
# dependencies but does not build or install the project itself.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
